name: Generate keystore (chạy 1 LẦN DUY NHẤT)

# Dùng khi không có máy tính để chạy keytool.
# Kết quả: artifact "keystore-secrets" (giữ 1 ngày) chứa 4 giá trị để dán vào GitHub Secrets.
# Sau khi lưu xong Secrets: XÓA artifact + log run này, và để repo ở chế độ Private.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.keystore -alias cardriver \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=CarDriverLauncher, O=CarTaxi, C=VN"
          {
            echo "RELEASE_KEYSTORE_BASE64=$(base64 -w0 release.keystore)"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=cardriver"
            echo "KEY_PASSWORD=$PASS"
          } > keystore-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
