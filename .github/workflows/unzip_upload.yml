name: Unzip upload to main

# Cách dùng: tải file .zip vào thư mục uploads/ của nhánh main.
# Workflow sẽ giải nén vào gốc repo, xóa file zip, commit, rồi chạy build APK.
on:
  push:
    branches: [ main ]
    paths: [ 'uploads/*.zip' ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-upload
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip files into repo root
        run: |
          shopt -s nullglob
          zips=(uploads/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Không có file zip nào trong uploads/"
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Giải nén: $z"
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            src="$tmp"
            # Nếu zip chỉ có 1 thư mục gốc (vd CarDriverLauncher/) thì bỏ lớp đó
            if [ "$(find "$tmp" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && \
               [ -d "$(find "$tmp" -mindepth 1 -maxdepth 1)" ]; then
              src=$(find "$tmp" -mindepth 1 -maxdepth 1)
            fi
            if [ -d "$src/.github/workflows" ]; then
              echo "::warning::Zip có .github/workflows nhưng GITHUB_TOKEN không được phép sửa thư mục này, nên bị bỏ qua. Hãy upload các file workflow thủ công."
            fi
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/workflows/' \
              --exclude='uploads/' \
              "$src"/ ./
            rm -f "$z"
          done

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "Unzip upload into repo"
          git push origin HEAD:main

      # Push bằng GITHUB_TOKEN không tự kích hoạt workflow khác, nên gọi build thủ công
      - name: Trigger APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_apk.yml --ref main || true
